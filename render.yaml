# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One service: the worker. The dashboard is deployed separately on Vercel,
# which is why there is no `web` service here.
#
# The split follows what each half actually is. The worker is a process that
# must never stop — it crawls on a schedule, holds a queue lease and keeps a
# database connection — and that is the one thing a serverless platform cannot
# host. The dashboard is a request/response app that is idle most of the day,
# which is the one thing serverless is good at. Putting both on a paid
# always-on instance means paying for an idle web server; putting both on
# Vercel means no worker at all.
#
# Deploy: Render → New → Blueprint → pick this repo. Render reads this file,
# creates the worker, and prompts once for every secret marked `sync: false`.
#
# ── Why the worker is a `worker` and not a `web` ────────────────────────────
#
# A Render `web` service must bind a port and is put to sleep on the free tier
# when nothing hits that port. This process binds nothing and must never sleep —
# a sleeping worker is exactly the failure this deployment exists to avoid. A
# `worker` service has no port, no health check, and no idle shutdown.

services:
  - type: worker
    name: naija-jobs-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Starter, not free: Render has no free worker tier, and this is the
    # process that has to stay up.
    plan: starter
    region: frankfurt
    branch: main
    dockerCommand: node --import tsx apps/worker/src/index.ts

    envVars:
      - key: NODE_ENV
        value: production

      # The direct driver. The `neon` WebSocket driver exists for networks that
      # reset the Postgres wire protocol on 5432; a datacentre is not one, and
      # going direct is faster with no extra layer to fail.
      - key: DATABASE_DRIVER
        value: pg

      # Points at the isolated `naija_jobs` database, not `neondb`.
      - key: DATABASE_URL
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_EMBEDDING_PROVIDER
        value: openai
      - key: AI_EMBEDDING_API_KEY
        sync: false

      # AUTH_SECRET and OPS_PASSWORD are deliberately absent.
      #
      # They sign dashboard sessions and open the ops console; this process
      # does neither. They belong in Vercel environment, with the app that
      # reads them. Requiring them here only created a way for a blank value
      # to stop discovery, enrichment and ranking entirely.

      # Four concurrent tasks on a paid instance. The ceiling here is politeness
      # to the job boards rather than CPU — the domain rate limiter is what
      # actually paces outbound requests.
      - key: WORKER_CONCURRENCY
        value: "4"

      # Jooble. Without it that source reports itself unavailable and is
      # skipped; the Jobberman and MyJobMag sitemaps need no credential.
      - key: JOOBLE_API_KEY
        sync: false

      - key: CRAWLER_USER_AGENT
        value: NaijaJobsBot/1.0
      - key: CRAWLER_CONTACT_EMAIL
        sync: false

      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
