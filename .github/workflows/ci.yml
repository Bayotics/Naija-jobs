# Continuous integration.
#
# The gate is deliberately simple: everything that can fail runs, and nothing
# deploys unless all of it passes. There is no "allow failure" step — a check
# that is allowed to fail is a check nobody reads.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the old run. Nobody needs the results of a commit that
  # has already been replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite boots PGlite per package, so it needs no service containers.
      # That is the whole reason the tests run against real SQL rather than
      # mocks: there is nothing to stand up.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails the build on a known-vulnerable dependency at high or above.
      # Moderate is noisy enough in a JS tree that gating on it trains people to
      # ignore the job.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # A last check that no credential reached the repository. The env schema
      # keeps secrets out of code by construction; this catches the case where
      # someone pastes one into a fixture.
      - name: Check for committed secrets
        run: |
          if git grep -nIE '(sk-[a-zA-Z0-9]{20,}|re_[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string is present in the repository."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Built but not pushed. Proving the image assembles is the useful signal;
      # pushing belongs to a release workflow with credentials this one does not
      # need to hold.
      - name: Build image
        run: docker build -t jobintel:ci .
