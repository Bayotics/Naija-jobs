# The pipeline, on a schedule, with no server to keep alive.
#
# ── Why this exists ─────────────────────────────────────────────────────────
#
# The worker is the right way to run this: one process, a queue, leases, and
# retries. But a hosted worker is a service that can be suspended, redeployed,
# or started with one environment variable missing — and when it stops, it
# stops silently. This system sat still for thirty-five hours that way while
# every page reported green.
#
# A scheduled workflow has none of that surface. There is no service to
# suspend, no second environment to keep in step, and a failed run is an email
# and a red mark in a tab the owner already visits. It is strictly less
# capable than the worker — no queue, no leases, no retries between steps —
# and it is far harder to leave silently dead.
#
# Run both if you like. They coordinate through the database: discovery is
# keyed on (source, hour), so a duplicate pass finds the work already done
# rather than doing it twice.
#
# ── Setup, once ─────────────────────────────────────────────────────────────
#
# Until the secrets below exist, this workflow does nothing: the preflight job
# finds no DATABASE_URL and the rest of the run is skipped. That is deliberate.
# A spare that cannot run is not a failure worth an email every hour, and a
# mailbox full of ignorable red is how a real failure goes unread.
#
# Settings → Secrets and variables → Actions → New repository secret:
#
#   DATABASE_URL          the Neon string ending in /naija_jobs
#   ANTHROPIC_API_KEY
#   AI_EMBEDDING_API_KEY
#   JOOBLE_API_KEY
#
# Add them and the next scheduled run picks them up by itself. Nothing else
# here has to change. Until then, "Run workflow" by hand fails loudly rather
# than skipping — asking for a run and getting silence is its own kind of lie.
name: Hourly pipeline

on:
  schedule:
    # Hourly. GitHub runs cron on UTC and may delay a run under load; this
    # pipeline is idempotent, so a late or skipped hour costs nothing but the
    # delay itself.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  # Never two at once. Each stage is idempotent, but two concurrent passes
  # would spend double the API calls to reach the same state.
  group: pipeline
  cancel-in-progress: false

jobs:
  # ── Is this spare even wired up? ──────────────────────────────────────────
  #
  # The worker on Render is the live runner. This workflow is the spare, and a
  # spare with no credentials is dormant, not broken. Separating "not
  # configured" from "configured and failing" is the whole point: the first is
  # a notice, the second is a red mark that means something.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Are the secrets here?
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # Asked for by hand, so say so. Left to the schedule, stay quiet.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::No DATABASE_URL secret. Add it under Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi

          echo "::notice::Dormant: no DATABASE_URL secret is set, so there is nothing for this workflow to run. The Render worker is unaffected."

  run:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      NODE_ENV: production
      # The direct driver, not the WebSocket one. These stages run for minutes
      # at a time, and a long-held Neon WebSocket drops with "Connection
      # terminated unexpectedly" partway through a matching pass.
      DATABASE_DRIVER: pg
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_EMBEDDING_PROVIDER: openai
      AI_EMBEDDING_API_KEY: ${{ secrets.AI_EMBEDDING_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      CRAWLER_USER_AGENT: NaijaJobsBot/1.0
      LOG_LEVEL: info
      LOG_PRETTY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── The pipeline ──────────────────────────────────────────────────────
      #
      # Each stage continues on error. A source being down must not stop
      # matching from scoring what is already stored, and ranking is what the
      # dashboard reads — it is the stage that must run even when everything
      # upstream had a bad hour.
      - name: Discover
        id: discover
        run: pnpm discover
        continue-on-error: true

      - name: Enrich
        id: enrich
        run: pnpm enrich
        continue-on-error: true

      - name: Match
        id: match
        run: pnpm match
        continue-on-error: true

      - name: Rank
        id: rank
        run: pnpm recommend
        continue-on-error: true

      # ── The gate ──────────────────────────────────────────────────────────
      #
      # `continue-on-error` on every stage means a run in which all four failed
      # still reports success, which is the exact false-green this workflow
      # exists to escape. A single bad source must not stop ranking; four
      # failures is not a bad source, it is a broken pipeline, and it has to be
      # a red mark.
      #
      # Ranking is singled out because it is what the dashboard reads. If it
      # cannot run, the numbers on the page are stale no matter what the
      # earlier stages managed.
      - name: Did anything actually work?
        run: |
          echo "discover: ${{ steps.discover.outcome }}"
          echo "enrich:   ${{ steps.enrich.outcome }}"
          echo "match:    ${{ steps.match.outcome }}"
          echo "rank:     ${{ steps.rank.outcome }}"

          if [ "${{ steps.rank.outcome }}" = "failure" ]; then
            echo "::error::Ranking failed, so the dashboard is showing stale results."
            exit 1
          fi
          if [ "${{ steps.discover.outcome }}" = "failure" ]             && [ "${{ steps.match.outcome }}" = "failure" ]; then
            echo "::error::Neither discovery nor matching ran. Nothing new will appear."
            exit 1
          fi

  # ── The weekly purge ──────────────────────────────────────────────────────
  #
  # Separate job on its own schedule rather than a step in the hourly one:
  # deleting things once a week does not belong inside something that runs
  # twenty-four times a day, where a mistake in the condition is a mistake made
  # hourly.
  purge:
    if: github.event_name == 'schedule' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, run]

    env:
      NODE_ENV: production
      DATABASE_DRIVER: pg
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Only on Sundays
        id: when
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "03" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'yes'

      - uses: pnpm/action-setup@v4
        if: steps.when.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.when.outputs.run == 'yes'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.when.outputs.run == 'yes'
        run: pnpm install --frozen-lockfile

      - name: Purge jobs past the retention window
        if: steps.when.outputs.run == 'yes'
        run: pnpm purge:jobs
